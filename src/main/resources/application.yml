spring:
  application:
    name: ecom
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecom}
    username: ${DB_USERNAME:ecom}
    password: ${DB_PASSWORD:ecom}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info