spring:
  application:
    name: ecom
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecom}
    username: ${DB_USERNAME:ecom}
    password: ${DB_PASSWORD:ecom}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-32-bytes-min}
    ttl: 15m
    issuer: https://ecom.local
  payments:
    provider: ${PAYMENTS_PROVIDER:fake}
    reservation-ttl: 30m
    sweep-interval: 60s
    sweeper:
      enabled: true
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}