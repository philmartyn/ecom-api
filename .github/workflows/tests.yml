name: Tests

# Every push, on any branch, plus pull requests. A push that already has an open
# PR would otherwise run twice, which is why the concurrency group below cancels
# the older run instead of queueing it.
on:
  push:
  pull_request:
  workflow_dispatch:

# contents: read for the checkout. checks: write so the test report can be
# attached to the commit as a check run with inline annotations.
permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Gradle test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The build pins Java 27 through a Gradle toolchain; installing it here
      # means the toolchain resolves without Gradle downloading a JDK itself.
      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'

      # Handles the Gradle cache, the wrapper download and the daemon lifecycle.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The tests start PostgreSQL with Testcontainers rather than a service
      # container, so they get exactly the image the project uses locally.
      # GitHub's ubuntu runners ship with Docker, which is all Testcontainers needs.
      - name: Run tests
        run: ./gradlew test --console=plain

      # Publishes the JUnit XML as a check run: pass/fail counts, one entry per
      # failed test, and annotations on the failing lines. It also writes the job
      # summary (job_summary defaults to true), so there is nothing to parse by hand.
      # Runs on failure as well as success; the Gradle step has already decided
      # the job's outcome, so this must not mask it.
      - name: Publish test report
        if: success() || failure()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_name: Test report
          detailed_summary: true
          # A green run has nothing to summarise beyond the check itself; the
          # failure table is what earns the space.
          skip_success_summary: true

      # The check run has the per-test detail; the HTML report is still handy
      # when you want to read a full stack trace, so keep it for failures only.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7

      # --- container smoke test ---------------------------------------------
      # The JVM tests prove the logic; this proves the deployable artifact
      # starts, migrates the schema and serves real traffic. The jar is built
      # once and copied into the image, so Docker never runs Gradle itself.
      - name: Build the application jar
        run: ./gradlew bootJar --console=plain

      - name: Build the test image
        run: docker build -t ecom-api:test .

      - name: Start PostgreSQL for the smoke test
        run: |
          docker network create ecom-smoke
          docker run -d --name ecom-smoke-db --network ecom-smoke \
            -e POSTGRES_DB=ecom \
            -e POSTGRES_USER=ecom \
            -e POSTGRES_PASSWORD=ecom \
            postgres:17-alpine

          for attempt in $(seq 1 30); do
            if docker exec ecom-smoke-db pg_isready -U ecom -d ecom > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1

      - name: Start the application image
        run: |
          docker run -d --name ecom-smoke-app --network ecom-smoke -p 8080:8080 \
            -e DB_URL=jdbc:postgresql://ecom-smoke-db:5432/ecom \
            -e DB_USERNAME=ecom \
            -e DB_PASSWORD=ecom \
            -e JWT_SECRET=ci-only-secret-at-least-32-bytes-long \
            ecom-api:test

      - name: Wait for the image to become healthy
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Image healthy after $((attempt * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "Image did not become healthy" >&2
          docker logs ecom-smoke-app
          exit 1

      # Proves the parts unit tests cannot: Flyway runs inside the container,
      # the HTTP stack serves the migrated schema, and register → login → /me
      # exercises writes, BCrypt and JWT signing end to end.
      - name: Smoke test the image
        run: |
          curl -fsS 'http://localhost:8080/api/products?size=1' > /dev/null

          email="smoke-$(date +%s)@example.com"
          curl -fsS -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"password123\",\"firstName\":\"Smoke\",\"lastName\":\"Test\"}" \
            > /dev/null

          token=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"password123\"}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')

          curl -fsS http://localhost:8080/api/auth/me \
            -H "Authorization: Bearer $token" > /dev/null

          # V2 must have applied, otherwise Hibernate validation would have
          # stopped the context and the health check would already have failed.
          docker exec ecom-smoke-db psql -U ecom -d ecom -tAc \
            "select version from flyway_schema_history where success order by installed_rank" \
            | grep -qx 2

      - name: Stop the smoke-test containers
        if: always()
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            docker logs ecom-smoke-app || true
          fi
          docker rm -f ecom-smoke-app ecom-smoke-db || true
          docker network rm ecom-smoke || true

